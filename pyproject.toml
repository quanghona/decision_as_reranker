[project]
name = "decision-as-reranker"
version = "0.1.2"
description = "Typed decision model as a reranker for RAG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Quang Hon Ly", email = "lyhonquang@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "numpy>=2.0.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
typesafe = [
    "typesafe-sdk>=0.7.5",
]
openai = [
    "openai>=3.38",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

keywords = ["decision-model", "typesafe", "reranker", "llm", "decision", "jev"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "openai>=3.38",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "typesafe-sdk>=0.7.5",
]
eval = [
    "bm25s>=0.2.0",
    "matplotlib>=3.8",
]
